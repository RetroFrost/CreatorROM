name: Build CreatorROM

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Signing mode
        type: choice
        options:
          - engineering
          - official
        default: engineering
  push:
    branches:
      - creatorrom-4.0.0

permissions:
  contents: write

concurrency:
  group: creatorrom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-beyond2lte:
    name: CreatorROM 4.0.0 · beyond2lte
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CREATORROM_OFFICIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'official' && 'true' || 'false' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune --all --force

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            attr bc brotli build-essential ccache clang ffmpeg g++-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu libbrotli-dev libbz2-dev libgtest-dev libpcre2-dev \
            libprotobuf-dev libunwind-dev libzstd-dev linux-modules-extra-$(uname -r) \
            lld p7zip-full protobuf-compiler python-is-python3 python3 wget webp
          wget -q https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py
          sudo install -m 0755 mkbootimg.py /usr/local/bin/mkbootimg
          sudo modprobe erofs
          sudo modprobe f2fs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure signing
        env:
          PLATFORM_KEY_PK8: ${{ secrets.PLATFORM_KEY_PK8 }}
          PLATFORM_KEY_PEM: ${{ secrets.PLATFORM_KEY_PEM }}
          OTA_KEY_PK8: ${{ secrets.OTA_KEY_PK8 }}
          OTA_KEY_PEM: ${{ secrets.OTA_KEY_PEM }}
        run: |
          if [[ "$CREATORROM_OFFICIAL" != "true" ]]; then
            echo "Using repository AOSP test keys for an unofficial engineering build."
            exit 0
          fi

          for key in PLATFORM_KEY_PK8 PLATFORM_KEY_PEM OTA_KEY_PK8 OTA_KEY_PEM; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done

          printf '%s' "$PLATFORM_KEY_PK8" | base64 --decode > security/creatorrom_platform.pk8
          printf '%s' "$PLATFORM_KEY_PEM" | base64 --decode > security/creatorrom_platform.x509.pem
          printf '%s' "$OTA_KEY_PK8" | base64 --decode > security/creatorrom_ota.pk8
          printf '%s' "$OTA_KEY_PEM" | base64 --decode > security/creatorrom_ota.x509.pem

      - name: Build dependencies
        run: |
          source ./buildenv.sh beyond2lte
          ./scripts/build_dependencies.sh

      - name: Download stock firmware
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh beyond2lte && ./scripts/download_fw.sh

      - name: Extract stock firmware
        run: |
          source ./buildenv.sh beyond2lte
          ./scripts/extract_fw.sh

      - name: Add swap
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-space-path: /swapfile
          swap-size-gb: 12
          remove-existing-swap-files: true

      - name: Build CreatorROM
        run: |
          source ./buildenv.sh beyond2lte
          ./scripts/make_rom.sh

      - name: Verify build output
        run: |
          shopt -s nullglob
          roms=(out/CreatorROM_*_beyond2lte*-sign.zip)
          if (( ${#roms[@]} != 1 )); then
            echo "Expected one signed CreatorROM ZIP, found ${#roms[@]}." >&2
            printf '%s\n' "${roms[@]}"
            exit 1
          fi
          sha256sum "${roms[0]}" | tee "${roms[0]}.sha256"

      - name: Publish a draft test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          roms=(out/CreatorROM_*_beyond2lte*-sign.zip)
          rom="${roms[0]}"
          name="$(basename "$rom")"
          stage="out/release-parts"
          mkdir -p "$stage"
          split -b 1900m -d -a 2 "$rom" "$stage/$name.part-"
          cp "$rom.sha256" "$stage/"

          tag="creatorrom-4.0.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$stage"/* \
            --target "$GITHUB_SHA" \
            --title "CreatorROM 4.0.0 beyond2lte · run $GITHUB_RUN_NUMBER" \
            --notes "Unverified Galaxy S10+ engineering build. Download every part, join them in numeric order, verify the SHA-256 file, and test only with a recoverable device." \
            --draft \
            --prerelease
